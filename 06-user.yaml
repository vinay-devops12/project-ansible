---
- name: user service
  hosts: user
  become: true
  vars:
    MONGODB_HOST: "mongodb.daws-90s.shop"
    REDIS_HOST: "redis.daws-90s.shop"
  tasks:   
    - name: enable nodejs:20 module stream
      ansible.builtin.command: dnf module enable nodejs:20 -y
      changed_when: false

    - name: install nodejs runtime
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: ensure roboshop system user exists
      ansible.builtin.user:
        name: roboshop
        system: true
        shell: /sbin/nologin
        home: /app
        state: present
        comment: "roboshop system user"

    - name: remove existing app directory 
      ansible.builtin.file:
        path: /app
        state: absent

    - name: clean user.zip in /tmp directory
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent 

    - name: create app directory 
      ansible.builtin.file:
        path: /app
        state: directory 
        owner: roboshop
        group: roboshop

    - name: download user artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip

    - name: extract user artifact to /app
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: install nodejs dependencies
      community.general.npm:
        path: /app
        state: present

    - name: deploy user systemd service configuration
      ansible.builtin.template:
        src: user.service.j2
        dest: /etc/systemd/system/user.service 
       

    - name: reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: enable and start user service
      ansible.builtin.service:
        name: user       
        state: restarted 
        enabled: yes
