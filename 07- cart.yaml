   - name: configure the cart sevrvice
     hosts: cart
     become: true
     tasks:
       - name: enable  nodejs -y service
         command: dnf module enable nodejs:20 -y

       - name: is installed
         ansible.builtin.package:
           name: nodejs
           state: present

       - name: Create the ansible system user
         ansible.builtin.user:
           name: roboshop
           system: true
           shell: /sbin/nologin
           home: /app
           comment: "Ansible Automation System Service Account"
           state: present

       - name: Remove a directory and all its contents
         ansible.builtin.file:
           path: /app
           state: absent

       - name: Remove the zip file in cart
         ansible.builtin.file:
           path: /tmp/cart.zip
           state: absent 

       - name: Create application directory
         ansible.builtin.file:
         path: /app
         state: directory

       - name: Download the cart file from a remote URL
         ansible.builtin.get_url:
           url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
           dest: /tmp/cart.zip
           
       
       - name: Extract archive already existing on the remote server
         ansible.builtin.unarchive:
           src: /tmp/cart.zip
           dest: /app
           remote_src: true

       - name: Install npm dependencies from package.json
         community.general.npm:
           path: /app
           state: present

       - name: Copy cart service binary or config
         ansible.builtin.template:
           src: cart.service.j2
           dest: /etc/systemd/system/cart.service

       - name: daemon to reload its configuration
         ansible.builtin.systemd_service:
           daemon_reload: true
   
       - name: start and is enabled and service    
         ansible.builtin.service:
           name: cart
           state: restarted
           enabled: true
      

         