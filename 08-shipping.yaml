---
- name: configure the service
  hosts: shipping
  become: yes
  vars:
    CART_HOST: "cart.daws-90s.shop"
    MYSQL_HOST: "mysql.daws-90s.shop"
  tasks:    
    - name: Install maven
      ansible.builtin.dnf:
        name: maven
        state: present 

    - name: Install mysql client and python-pip
      ansible.builtin.dnf:
        name:
          - mysql
          - python3-pip
        state: present

    - name: Create the system user for the service
      ansible.builtin.user:
        name: roboshop
        system: true          
        home: /app  
        shell: /sbin/nologin   
        comment: "System account for shipping"
        state: present

    - name: Delete the directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Delete the zip file
      ansible.builtin.file:
        path: /tmp/shipping.zip
        state: absent

    - name: create app directory
      ansible.builtin.file:
        path: /app
        state: directory 
        owner: roboshop
        group: roboshop

    - name: Download the Shipping jar file
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
        dest: /tmp/shipping.zip

    - name: Extract an archive already present on the target host
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Run mvn clean package
      ansible.builtin.command: "mvn clean package"
      args:
        chdir: /app
      register: maven_output

    - name: move shipping jar
      ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
      args:
        chdir: /app
      
    - name: Copy shipping service
      ansible.builtin.template:
        src: shipping.service.j2
        dest: /etc/systemd/system/shipping.service
      
    - name: install python dependencies
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3.9

    - name: load the mysql data
      community.mysql.mysql_db:
        name: all
        state: import
        login_user: root
        login_password: RoboShop@1
        login_host: "{{ MYSQL_HOST }}"
        target: "{{ item }}"
      loop:
        - /app/db/schema.sql
        - /app/db/app-user.sql 
        - /app/db/master-data.sql

    - name: start the daemon_reload
      ansible.builtin.systemd_service: 
        daemon_reload: true

    - name: enable and start shipping
      ansible.builtin.service:
        name: shipping
        state: restarted
        enabled: yes



       

      