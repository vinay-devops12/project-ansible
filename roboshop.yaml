
- name: roboshop instance management
  hosts: localhost
  connection: local
  vars:
    instances:
      - mongodb
      - redis
      - rabbitmq
      - catalogue
      - frontend
    ami_id: "ami-0220d79f3f480ecf5"

  tasks:
    - name: create ec2-instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        security_groups:
          - "roboshop-{{ item }}"
          - roboshop-common
        state: running
      loop: "{{ instances }}"
      register: ec2_output

    - name: print output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"